schema_version: 1
app:
  name: paqad-ai
  kind: cli
  frameworks:
    - commander
    - node
  generated_from: paqad-ai sitemap run — node-cli extractor
  language: en
  freshness:
    anchors_total: 95
    anchors_resolved: 95
    anchors_broken: 0
actors:
  - id: developer
    label: Developer
    satisfies:
      - paqad-enabled
      - flag-site-map
      - flag-rag
    note: A person driving the paqad-ai CLI locally with the framework enabled.
  - id: automation
    label: CI / automation
    satisfies:
      - paqad-enabled
    note: Non-interactive runs (CI, hooks, scheduled) invoking the CLI.
guards:
  - id: paqad-enabled
    kind: data-state
    label: Framework enabled
    requires: paqad_enable resolves ON (default) across env / .config / configs
    satisfy_via: Leave paqad_enable unset, or set it to true/on (env PAQAD_ENABLE).
    evidence:
      file: src/core/framework-config.ts
      line: 108
    trust: proven-in-code
  - id: flag-site-map
    kind: feature-flag
    label: Site Map capability
    flag_key: site_map
    required_variant: "true"
    provider: paqad-config
    requires: the site_map flag is on
    satisfy_via: Set site_map=true (env PAQAD_SITE_MAP) in a config layer.
    evidence:
      file: src/core/framework-config.ts
      line: 228
    trust: proven-in-code
  - id: flag-rag
    kind: feature-flag
    label: RAG retrieval capability
    flag_key: rag_enabled
    required_variant: "true"
    provider: paqad-config
    requires: the rag_enabled flag is on
    satisfy_via: Set rag_enabled=true in a config layer and build the index.
    evidence:
      file: src/core/framework-config.ts
      line: 278
    trust: proven-in-code
areas:
  - id: lifecycle
    label: Lifecycle & Setup
  - id: feature-dev
    label: Feature Development
  - id: knowledge
    label: Knowledge & Retrieval
  - id: delivery
    label: Delivery & Release
  - id: governance
    label: Governance & Decisions
  - id: compliance
    label: Compliance
  - id: health
    label: Codebase Health & Modules
  - id: sitemap
    label: Site Map
  - id: visualization
    label: Dashboard & Visualization
  - id: extensibility
    label: Capabilities & Packs
  - id: audit
    label: Audit & Evidence
  - id: intake
    label: Intake
