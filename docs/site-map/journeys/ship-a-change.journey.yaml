# Proposed journey — becomes `confirmed` only via human sign-off through the dashboard
# (`paqad-ai sitemap journey confirm`), never self-approved.
schema_version: 1
id: ship-a-change
label: Plan, spec, verify and deliver a code change
actor: developer
goal: Take a code change through the full feature-development lane to a shippable, evidenced state.
entry: node-cli-plan
priority: high
status: proposed
derivation: agent
steps:
  - surface: node-cli-plan
    action: Run `paqad-ai plan compile` to record the plan (with its reuse section).
    expect: A plan.json artifact minted into the feature bundle. Planning does not stop to ask the owner; questions it raises wait for the spec question round. When the routing guess was full and the plan touches 8 files or fewer, none sensitive, with no schema or breaking API change, it prints "lane set to graduated from full" and the change continues on the graduated lane. When a fast-lane plan lists a skill path (a SKILL.md or a file in a skill folder), it prints "lane raised to graduated from fast: the change creates or edits a skill (<path>), so the Skill Orchestrator sits at the High Table." and the specification stage runs with the High Table. On graduated the main agent runs each stage itself with `paqad-ai stage start/end`; on full each stage runs in its own stage helper. Setting `stage_isolation_lanes` and `spec_pipeline_experts_lanes` to `graduated,full` restores the old behaviour.
  - surface: node-cli-spec
    action: At the spec questions step, run `paqad-ai spec pipeline round` and ask the owner every pending question for the change in one round.
    expect: The owner answers once per change, up to 4 questions at a time; each answer is resolved with `paqad-ai decision resolve` before development starts.
  - surface: node-cli-spec
    action: Run `paqad-ai spec freeze` to freeze the specification.
    expect: A specification.json artifact with confirmed invariants.
  - surface: node-cli-skill
    action: For a change that touches a skill path, run `paqad-ai skill justify` through `paqad-ai skill release` for each skill.
    expect: Each stage writes its artifact into .paqad/tmp/authoring/skills/<name>/ and refuses to start while an earlier gate fails; release writes skill-<name>.json into the bundle, which the end-of-change check needs for every new or edited skill.
  - surface: node-cli-checks
    action: Run `paqad-ai checks run` to execute the deterministic verification gates.
    expect: Gate results recorded; failures block the change.
  - surface: node-cli-review
    action: Run `paqad-ai review record` to capture the review.
    expect: A review.json artifact in the bundle.
  - surface: node-cli-deliver
    action: Run `paqad-ai deliver` to produce the end-of-change delivery receipt.
    expect: A delivery receipt with the contract verdict. In a cloud session where GitHub refuses `gh`, the pull request, comments and checks go through the GitHub REST API.
ends:
  success: The change reaches a "Safe to merge" verdict with a complete evidence bundle.
  failure: A blocking gate leaves the change "Needs your attention".
