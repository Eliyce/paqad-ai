# SAMPLE journey (hand-authored, schema draft 0) — a PROMPT-WORKFLOW journey.
# Demonstrates: prompt entry, router as decision point, staged workflow with a
# human pause, dual ends, and cross-surface hand-off (chat → dashboard).
schema_version: 0-draft
id: create-documentation
label: Create the project documentation via a prompt
actor: coding-agent
on_behalf_of: developer
goal: "The project gains foundation docs and a reviewed module map, written by the agent under paqad's contract"
entry: agent-chat.prompt-entry
steps:
  - surface: agent-chat.prompt-entry
    action: "developer types: create documentation"
    expect: "a '▸ paqad' line announces the routed workflow"
  - surface: agent-chat.router
    action: "router matches the phrase (priority 220 band)"
    expect: "workflow = documentation-update, no clarifying question asked"
  - surface: agent-chat.workflow.documentation-update
    step: write-foundation
    action: "agent re-reads live manifests, writes docs/instructions/** (stack, architecture, registries)"
    expect: "narrated progress; files appear under docs/instructions/"
  - surface: agent-chat.workflow.documentation-update
    step: discover-modules
    action: "agent discovers business modules and writes module-map.yml"
    expect: "low-confidence modules are called out explicitly"
  - surface: agent-chat.workflow.documentation-update
    step: map-review
    type: decision-pause
    action: "developer reviews the proposed module map"
    expect: "verbatim Stage-1 final message; moduleDocStage=pending_map_review"
branches:
  - at: agent-chat.router
    when: "phrase also matches a code-change intent"
    then: "routes to feature-development instead — this journey does not start"
ends:
  success: "map reviewed; developer follows up with 'create module documentation' (journey: module docs)"
  failure: "paqad disabled or bootstrap unreadable → agent proceeds as a plain assistant; no paqad artifacts"
next_journeys: [module-documentation] # journey trimmed from this sample (its workflow surface is too)
tests: [] # gap, on purpose: shows how an untested journey reads in the map
priority: high
status: confirmed
derivation: human
evidence:
  - { file: runtime/AGENT-BOOTSTRAP.md, line: 29 }
  - { file: runtime/base/skills/documentation-workflow/SKILL.md, line: 51 }
