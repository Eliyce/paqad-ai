# SAMPLE journey (fictional app, schema draft 0) — the "money path".
# Demonstrates: business-language steps, a flag-variant branch, an external
# hand-off with explicit failure return, and test linkage per variant.
schema_version: 0-draft
id: checkout
label: Shopper buys a product
actor: shopper
goal: "A signed-in shopper pays for the items in their cart"
entry: catalog.list
steps:
  - { surface: catalog.list,   action: "pick a product",        expect: "product details shown" }
  - { surface: catalog.detail, action: "add to cart",           expect: "cart badge increments" }
  - { surface: cart.view,      action: "proceed to checkout",   expect: "checkout opens" }
  - surface: checkout.classic
    variant: { group: checkout, when: "flag.new-checkout OFF" }
    action: "complete 3-step checkout"
    expect: "hand-off to Stripe"
  - surface: checkout.express
    variant: { group: checkout, when: "flag.new-checkout ON" }
    action: "complete single-page checkout"
    expect: "hand-off to Stripe"
  - { surface: external.stripe, action: "pay", expect: "redirect back on success" }
  - { surface: order.confirmation, action: "—", expect: "order number visible; receipt email queued" }
ends:
  success: order.confirmation
  failure:
    - { at: external.stripe, then: cart.view, note: "payment cancelled/declined — cart preserved" }
    - { at: checkout.classic, then: cart.view, note: "session expired → sign-in loop" }
uses: [journey:sign-in]
tests:
  - { spec: tests/e2e/checkout-classic.spec.ts, variant: "flag OFF" }
  - { spec: null, variant: "flag ON" } # visible gap: express variant untested → SM finding
priority: high
status: confirmed
derivation: human
