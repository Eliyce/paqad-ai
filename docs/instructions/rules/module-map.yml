# paqad-product-discovery: module map
#
# The authoritative list of business modules, their business-language names, and the source each
# one owns. Generated by the paqad documentation-update workflow on 2026-10-05 from build/skills.yml,
# skills/, shared/, build/, tests/ and REQUIREMENTS.md sections 4 and 6.
#
# REVIEW THIS FILE BEFORE RUNNING `create module documentation`.
# Module and feature names here become the names used in docs/modules/**, in registries, and in
# future module-attribution decisions. Rename anything that is not the word the team uses.
#
# Discovery precedence used: no user-provided map and no locked entries existed, so modules come
# from the codebase-native containers (one folder per skill under skills/, one file per shared
# module under shared/), grouped by the business capability REQUIREMENTS.md section 4 names.
#
# Schema per module:
#   slug         stable id; becomes docs/modules/<slug>/
#   name         business-language display name
#   layer        user-facing | shared-foundation | build-and-delivery
#   confidence   high | medium | low: how sure the boundary is
#   summary      one line: what the module is responsible for
#   sources      paths this module owns; a path belongs to exactly one module
#   depends_on   modules this one relies on
#   features     distinct capabilities: slug, name, sources

version: 2
generatedAt: 2026-10-05
confidence: medium
notes: |
  The plugin is 13 skills plus shared material and a build. A skill folder is the natural unit of
  ownership, so user-facing modules group skills by the job a business user is doing (ask, shape
  an idea, draft, post, refine, size, plan). Shared modules own the files under shared/ that many
  skills import at build time. Build-and-delivery modules are for contributors.

modules:

  # ------------------------------------------------------------------ user-facing

  - slug: product-questions
    name: Product Questions
    layer: user-facing
    confidence: high
    summary: Answers a business question about what the product does today, from the onboarded documents, with sources.
    sources:
      - skills/ask-project
    depends_on: [project-grounding, conversation-standards]
    features:
      - slug: answer-a-question
        name: Answer a question with sources
        sources: [skills/ask-project/SKILL.md, skills/ask-project/references/answer-template.md]
      - slug: hand-over-to-idea
        name: Turn an answer into an idea
        sources: [skills/ask-project/SKILL.md]

  - slug: idea-journey
    name: Idea Journey
    layer: user-facing
    confidence: high
    summary: Coordinates steps 0 to 4 of shaping an idea, from getting connected to settling every open choice, with resume and going back.
    sources:
      - skills/product-discovery
      - skills/get-connected
      - skills/understand-idea
      - skills/ground-in-project
      - skills/shape-idea
      - skills/decide-together
    depends_on: [discovery-record, project-grounding, conversation-standards, ticket-drafting, ticket-posting]
    features:
      - slug: coordinate-journey
        name: Step order, status, resume and going back
        sources: [skills/product-discovery]
      - slug: get-connected
        name: Check documents and tracker are ready
        sources: [skills/get-connected]
      - slug: understand-the-idea
        name: Understand the idea
        sources: [skills/understand-idea]
      - slug: ground-in-the-project
        name: Find what exists today
        sources: [skills/ground-in-project]
      - slug: shape-the-idea
        name: Shape the idea with options and risks
        sources: [skills/shape-idea]
      - slug: decide-together
        name: Settle open choices
        sources: [skills/decide-together]

  - slug: ticket-drafting
    name: Ticket Drafting and Checking
    layer: user-facing
    confidence: high
    summary: Turns the decided idea into epics and tickets in business language, then checks them for gaps, duplicates, jargon and untestable outcomes.
    sources:
      - skills/write-tickets
      - skills/check-tickets
    depends_on: [conversation-standards, tracker-checks, discovery-record]
    features:
      - slug: draft-tickets
        name: Draft the ticket set
        sources: [skills/write-tickets]
      - slug: check-tickets
        name: Check the ticket set
        sources: [skills/check-tickets]

  - slug: ticket-posting
    name: Posting to the Tracker
    layer: user-facing
    confidence: high
    summary: Shows the final set, takes an explicit go-ahead, creates the tickets in order, reads them back and reports, or exports when posting is not possible.
    sources:
      - skills/post-tickets
    depends_on: [tracker-checks, discovery-record, conversation-standards]
    features:
      - slug: post-tickets
        name: Post approved tickets
        sources: [skills/post-tickets/SKILL.md, skills/post-tickets/references/post-procedure.md, skills/post-tickets/scripts/plan_posting.py]
      - slug: export-tickets
        name: Export tickets as CSV or Markdown
        sources: [skills/post-tickets/scripts/export_csv.py]

  - slug: ticket-refinement
    name: Ticket Refinement
    layer: user-facing
    confidence: high
    summary: Improves existing tickets field by field and writes only an approved change set, guarding against conflicting edits and lost rich content.
    sources:
      - skills/refine-ticket
    depends_on: [discovery-record, tracker-checks, conversation-standards]
    features:
      - slug: refine-a-ticket
        name: Refine an existing ticket
        sources: [skills/refine-ticket]

  - slug: work-sizing
    name: Work Sizing
    layer: user-facing
    confidence: high
    summary: Suggests a size from comparable finished work, labelled as advice, and writes it only on request.
    sources:
      - skills/size-work
    depends_on: [discovery-record, tracker-checks, conversation-standards]
    features:
      - slug: suggest-a-size
        name: Suggest a size
        sources: [skills/size-work]

  - slug: sprint-planning
    name: Sprint Planning
    layer: user-facing
    confidence: high
    summary: Proposes what fits the next sprint from capacity, priority and readiness, and assigns only the approved tickets.
    sources:
      - skills/plan-sprint
    depends_on: [discovery-record, tracker-checks, conversation-standards]
    features:
      - slug: plan-a-sprint
        name: Plan a sprint
        sources: [skills/plan-sprint]

  # ------------------------------------------------------------------ shared foundations

  - slug: discovery-record
    name: Discovery Record
    layer: shared-foundation
    confidence: medium
    summary: The run's memory and main control; revisioned blocks, staleness on going back, and approvals bound to content digests.
    sources:
      - shared/scripts/record.py
      - shared/scripts/check_record.py
      - shared/scripts/canonical.py
      - skills/product-discovery/assets/record-template.md
    depends_on: []
    features:
      - slug: record-lifecycle
        name: Create, update and advance the record
        sources: [shared/scripts/record.py, skills/product-discovery/assets/record-template.md]
      - slug: approval-digests
        name: Approvals bound to content
        sources: [shared/scripts/canonical.py]
      - slug: step-readiness-check
        name: Step readiness check
        sources: [shared/scripts/check_record.py]

  - slug: project-grounding
    name: Project Grounding
    layer: shared-foundation
    confidence: medium
    summary: Reads an onboarded project's documents in order, finds related areas, and tells real content from template text.
    sources:
      - shared/scripts/find_related.py
      - shared/scripts/detect_placeholder.py
      - shared/references/paqad-docs-map.md
      - shared/references/template-markers.md
    depends_on: []
    features:
      - slug: find-related-areas
        name: Find related areas
        sources: [shared/scripts/find_related.py, shared/references/paqad-docs-map.md]
      - slug: detect-template-text
        name: Spot unfilled template text
        sources: [shared/scripts/detect_placeholder.py, shared/references/template-markers.md]

  - slug: conversation-standards
    name: Conversation Standards
    layer: shared-foundation
    confidence: medium
    summary: How every reply looks and sounds, the consultant stance, plain language and the ticket writing rules.
    sources:
      - shared/references/voice.md
      - shared/references/consulting.md
      - shared/references/plain-language.md
      - shared/references/writing-rules.md
    depends_on: []
    features:
      - slug: voice
        name: Short, plain replies
        sources: [shared/references/voice.md]
      - slug: consulting-stance
        name: Consultant, not questionnaire
        sources: [shared/references/consulting.md]
      - slug: plain-language
        name: Plain business words
        sources: [shared/references/plain-language.md]
      - slug: writing-rules
        name: Ticket writing rules
        sources: [shared/references/writing-rules.md]

  - slug: tracker-checks
    name: Tracker Write Checks
    layer: shared-foundation
    confidence: medium
    summary: Checks that keep tracker writes safe and readable; prose lint, read-back against what was approved, and the Jira profile.
    sources:
      - shared/scripts/check_prose.py
      - shared/scripts/check_readback.py
      - shared/references/tracker-profiles
    depends_on: [discovery-record]
    features:
      - slug: prose-check
        name: Prose check
        sources: [shared/scripts/check_prose.py]
      - slug: read-back-check
        name: Read back what was written
        sources: [shared/scripts/check_readback.py]
      - slug: jira-profile
        name: Jira tracker profile
        sources: [shared/references/tracker-profiles-jira.md]

  # ------------------------------------------------------------------ build and delivery

  - slug: plugin-build
    name: Plugin Build
    layer: build-and-delivery
    confidence: high
    summary: Assembles the skills-only plugin from one source of truth and generates every host manifest deterministically.
    sources:
      - build/build.py
      - build/skills.yml
    depends_on: []
    features:
      - slug: assemble-dist
        name: Assemble the plugin output
        sources: [build/build.py, build/skills.yml]
      - slug: generate-manifests
        name: Generate host manifests
        sources: [build/build.py]

  - slug: quality-and-release
    name: Quality and Release
    layer: build-and-delivery
    confidence: medium
    summary: Unit tests, conversation eval scenarios and fixtures, CI and release workflows, and the manual host verification harness.
    sources:
      - tests/scripts
      - tests/evals
      - .github/workflows
      - .changeset
      - hosts
    depends_on: [plugin-build]
    features:
      - slug: unit-tests
        name: Script and authoring tests
        sources: [tests/scripts]
      - slug: conversation-evals
        name: Conversation eval scenarios
        sources: [tests/evals]
      - slug: ci-pipeline
        name: CI and release workflows
        sources: [.github/workflows, .changeset]
      - slug: host-verification
        name: Manual host verification
        sources: [hosts]
