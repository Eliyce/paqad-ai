    enforced_by: []
    scripts: []
  - id: RL-174d
    source: docs/instructions/rules/coding/feature-development.md
    text: "Before compiling the plan, check the Existing surface section and/or run `npx paqad-ai index query <name>`. The plan must record what you checked (`consulted`), what you will reuse (`reusing`), and must justify anything new (`new_constructs`). A plan template without a `reuse` section does not compile, so a change can never quietly rebuild something the project already has. First-party claims are checked against the code-knowledge index (an unknown symbol fails with the nearest match); when a framework is detected, a new construct must also record the framework check, and a framework-native claim must name the installed version. A framework-native claim is additionally verified against the declarations shipped inside the installed package (`npx paqad-ai index framework-api build`): a symbol that does not exist at that version fails with the nearest match, and one carrying a static `@deprecated` marker fails citing the deprecation message — so a plan can never adopt an API that was already removed or is already on its way out. A dynamically-provided member warns rather than failing, and a missing index, stack snapshot, or framework-api index downgrades the check to a warning rather than blocking."
    text_hash: afe551aa5320e25f7a853b12d6afdbc58cf73a21d0dce44f736a1b37d29db041
