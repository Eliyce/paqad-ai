# Rules Discovery Workflow
#
# Keeps an onboarded project's rules and stack docs current for the Developer / Operator. It is a
# routed workflow, not a feature-development route: it loads the rule contract but runs no
# rule-scripts at turn end and emits no feature-evidence bundle. Its run files live under
# `.paqad/ledger/rules-discovery/<run_id>/`; the stack baseline is
# `.paqad/ledger/rules-discovery/baseline.json`.
schema_version: "1"

routing:
  is_feature_development: false
  loads_rules: true
  phrases:
    - discover rules
    - update our rules
    - audit our rules
    - are my rules out of date?

orchestrator_skill: rules-discovery

# Steps in order. Only a `paqad-ai rules` verb moves run.json from one step to the next, with an
# expected-revision check; a skill never edits it.
steps:
  inventory:
    verb: paqad-ai rules inventory --run <run_id>
    artifact: stack-inventory.json
  decisions:
    skill: rules-decision-miner
    verb: paqad-ai rules discovery decisions
    artifact: from-decisions.json
  research:
    skill: rules-researcher
    verb: paqad-ai rules discovery research --run <run_id>
    artifact: from-research.json, sources.json, research.json
  propose:
    skill: rules-proposer
    verb: paqad-ai rules discovery propose | review | sign-off --run <run_id>
    artifact: proposal.json, proposal.md, proposal-judgements.json
  sign_off:
    decision_category: rules.proposal
    options: [sign_off, not_now]
  apply:
    verb: paqad-ai rules discovery apply --run <run_id>
    artifact: apply.json
  docs:
    verb: paqad-ai rules discovery docs --run <run_id>
    artifact: report.json
  done: {}

resume:
  start: paqad-ai rules discovery start [--continue | --fresh]
  status: paqad-ai rules discovery status
  fresh_start: >-
    Closes the open run as abandoned, answers its sign-off decision not now, and leaves its
    decisions untagged so they are judged again.
