schema_version: '1.1'
name: routing-site-map
description: 'Mapping the app routes to site-map.'
tags: [routing]
plugins: ['../../..']
context:
  scaffold_script: scaffold.sh
execution:
  prompt: "map the app's surfaces, navigation and journeys"
  max_turns: 4
  timeout_seconds: 180
graders:
  - type: regex
    name: routed-site-map
    target: { source: file, path: .paqad/context/.session-route.json }
    pattern: '"workflow":"site-map"'
