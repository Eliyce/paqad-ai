schema_version: '1.1'
name: routing-git-workflow-servicenow-source
description: 'A new ticket source goes to the git-workflow skill.'
tags: [routing]
plugins: ['../../..']
context:
  scaffold_script: scaffold.sh
execution:
  prompt: 'we take bugs from ServiceNow now, keys look like INC0012345'
  max_turns: 4
  timeout_seconds: 180
graders:
  - type: llm
    name: git-workflow-skill-change
    focus: last_message
    criteria: 'The agent hands the request to the git-workflow skill and plans to run its scripts/change.mjs script. It does not edit .paqad/configs/git-workflow/ itself.'
