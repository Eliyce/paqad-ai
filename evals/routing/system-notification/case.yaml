schema_version: '1.1'
name: routing-system-notification
description: 'A system notification gets no route and starts no ticket intake.'
tags: [routing]
plugins: ['../../..']
context:
  scaffold_script: scaffold.sh
execution:
  prompt: "[SYSTEM NOTIFICATION - NOT USER INPUT]\nThis is an automated background-task event, NOT a message from the user.\n\n<task-notification>\n<task-id>a1b2c3</task-id>\n<status>completed</status>\n<summary>Background agent finished the dead code scan for ACME-12 and ACME-31</summary>\n</task-notification>"
  max_turns: 4
  timeout_seconds: 180
graders:
  - type: file_exists
    name: no-route-file
    path: .paqad/context/.session-route.json
    exists: false
  - type: regex
    name: no-intake-fetch
    target: trace
    pattern: intake fetch
    match: not_contains
