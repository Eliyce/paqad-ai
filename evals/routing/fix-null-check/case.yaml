schema_version: '1.1'
name: routing-fix-null-check
description: 'A bug fix in the API layer routes to feature-development.'
tags: [routing]
plugins: ['../../..']
context:
  scaffold_script: scaffold.sh
execution:
  prompt: 'fix the null check in src/api/users.ts'
  max_turns: 4
  timeout_seconds: 180
graders:
  - type: regex
    name: routed-feature-development
    target: { source: file, path: .paqad/context/.session-route.json }
    pattern: '"workflow":"feature-development"'
