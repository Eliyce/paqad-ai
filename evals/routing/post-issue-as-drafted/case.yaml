schema_version: '1.1'
name: routing-post-issue-as-drafted
description: 'Posting a drafted issue is not feature work.'
tags: [routing]
plugins: ['../../..']
context:
  scaffold_script: scaffold.sh
execution:
  prompt: 'post this issue to GitHub as drafted'
  max_turns: 4
  timeout_seconds: 180
graders:
  - type: regex
    name: not-feature-development
    target: { source: file, path: .paqad/context/.session-route.json }
    pattern: '"workflow":"feature-development"'
    match: not_contains
