schema_version: '1.1'
name: routing-refactor-find-user
description: 'A refactor routes to feature-development.'
tags: [routing]
plugins: ['../../..']
context:
  scaffold_script: scaffold.sh
execution:
  prompt: 'Refactor findUser in src/db/client.ts to look users up in a Map instead of a ternary.'
  max_turns: 4
  timeout_seconds: 180
graders:
  - type: regex
    name: routed-feature-development
    target: { source: file, path: .paqad/context/.session-route.json }
    pattern: '"workflow":"feature-development"'
