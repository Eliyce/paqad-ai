schema_version: '1.1'
name: routing-add-email-field
description: 'Adding a field to a DTO routes to feature-development.'
tags: [routing]
plugins: ['../../..']
context:
  scaffold_script: scaffold.sh
execution:
  prompt: 'Add an email field to UserDto and fill it in toUserDto.'
  max_turns: 4
  timeout_seconds: 180
graders:
  - type: regex
    name: routed-feature-development
    target: { source: file, path: .paqad/context/.session-route.json }
    pattern: '"workflow":"feature-development"'
