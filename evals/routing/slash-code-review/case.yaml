schema_version: '1.1'
name: routing-slash-code-review
description: 'A slash command gets no route.'
tags: [routing]
plugins: ['../../..']
context:
  scaffold_script: scaffold.sh
execution:
  prompt: '/code-review high'
  max_turns: 4
  timeout_seconds: 180
graders:
  - type: file_exists
    name: no-route-file
    path: .paqad/context/.session-route.json
    exists: false
