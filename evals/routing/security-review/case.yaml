schema_version: '1.1'
name: routing-security-review
description: 'A security review routes to pentest.'
tags: [routing]
plugins: ['../../..']
context:
  scaffold_script: scaffold.sh
execution:
  prompt: 'run a security review'
  max_turns: 4
  timeout_seconds: 180
graders:
  - type: regex
    name: routed-pentest
    target: { source: file, path: .paqad/context/.session-route.json }
    pattern: '"workflow":"pentest"'
