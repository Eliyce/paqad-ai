schema_version: '1.1'
name: routing-what-does-this-project-do
description: 'A question about the project routes to project-question.'
tags: [routing]
plugins: ['../../..']
context:
  scaffold_script: scaffold.sh
execution:
  prompt: 'what does this project do?'
  max_turns: 4
  timeout_seconds: 180
graders:
  - type: regex
    name: routed-project-question
    target: { source: file, path: .paqad/context/.session-route.json }
    pattern: '"workflow":"project-question"'
