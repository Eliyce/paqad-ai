schema_version: '1.1'
name: routing-unknown-name-fallback
description: 'A small code change once routed to no-workflow routes to feature-development.'
tags: [routing]
plugins: ['../../..']
context:
  scaffold_script: scaffold.sh
execution:
  prompt: "In src/api/users.ts, make toUserDto fall back to the name 'Unknown' when user.name is null."
  max_turns: 4
  timeout_seconds: 180
graders:
  - type: regex
    name: routed-feature-development
    target: { source: file, path: .paqad/context/.session-route.json }
    pattern: '"workflow":"feature-development"'
