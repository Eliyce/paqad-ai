schema_version: '1.1'
name: routing-design-audit
description: 'A design system audit routes to design-test.'
tags: [routing]
plugins: ['../../..']
context:
  scaffold_script: scaffold.sh
execution:
  prompt: 'audit the UI against the design system'
  max_turns: 4
  timeout_seconds: 180
graders:
  - type: regex
    name: routed-design-test
    target: { source: file, path: .paqad/context/.session-route.json }
    pattern: '"workflow":"design-test"'
