schema_version: '1.1'
name: routing-discovery
description: 'An idea that still needs shaping routes to discovery.'
tags: [routing]
plugins: ['../../..']
context:
  scaffold_script: scaffold.sh
execution:
  prompt: 'I have a rough idea about adding user roles but I am not sure what it should look like yet. Help me shape it.'
  max_turns: 4
  timeout_seconds: 180
graders:
  - type: regex
    name: routed-discovery
    target: { source: file, path: .paqad/context/.session-route.json }
    pattern: '"workflow":"discovery"'
