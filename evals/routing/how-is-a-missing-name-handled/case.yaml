schema_version: '1.1'
name: routing-how-is-a-missing-name-handled
description: 'A question about behaviour routes to project-question.'
tags: [routing]
plugins: ['../../..']
context:
  scaffold_script: scaffold.sh
execution:
  prompt: 'How does toUserDto handle a user whose name is null?'
  max_turns: 4
  timeout_seconds: 180
graders:
  - type: regex
    name: routed-project-question
    target: { source: file, path: .paqad/context/.session-route.json }
    pattern: '"workflow":"project-question"'
