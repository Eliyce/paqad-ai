schema_version: '1.1'
name: routing-where-is-find-user
description: 'A question about a symbol routes to project-question.'
tags: [routing]
plugins: ['../../..']
context:
  scaffold_script: scaffold.sh
execution:
  prompt: 'Where is findUser defined and what does it return?'
  max_turns: 4
  timeout_seconds: 180
graders:
  - type: regex
    name: routed-project-question
    target: { source: file, path: .paqad/context/.session-route.json }
    pattern: '"workflow":"project-question"'
