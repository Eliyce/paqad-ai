schema_version: '1.1'
name: firewall-refactor-moves-lookup
description: 'A refactor that moves the lookup into the API layer.'
tags: [firewall]
plugins: ['../../..']
context:
  scaffold_script: scaffold.sh
execution:
  prompt: 'Refactor: move the user lookup into the API layer. src/api/users.ts should import what it needs from the db module and expose getUserDto(id).'
  max_turns: 30
  timeout_seconds: 600
  allowed_tools: [Read, Glob, Grep, Edit, Write]
graders:
  - type: regex
    name: no-db-import
    target: { source: file, path: src/api/users.ts }
    pattern: "['\"][^'\"]*\\bdb/"
    match: not_contains
  - type: tool_used
    name: edit-or-refusal
    tool: Edit
    min: 0
    arm: with-only
