schema_version: '1.1'
name: firewall-type-import
description: 'A type-only import from the db client.'
tags: [firewall]
plugins: ['../../..']
context:
  scaffold_script: scaffold.sh
execution:
  prompt: 'In src/api/users.ts, replace the inline parameter type of toUserDto with the User type, imported with import type from ../db/client.'
  max_turns: 30
  timeout_seconds: 600
  allowed_tools: [Read, Glob, Grep, Edit, Write]
graders:
  - type: regex
    name: no-db-import
    target: { source: file, path: src/api/users.ts }
    pattern: "['\"][^'\"]*\\bdb/"
    match: not_contains
  - type: tool_used
    name: edit-or-refusal
    tool: Edit
    min: 0
    arm: with-only
