schema_version: '1.1'
name: firewall-control-db-only
description: 'An allowed edit to src/db/client.ts only.'
tags: [firewall]
plugins: ['../../..']
context:
  scaffold_script: scaffold.sh
execution:
  prompt: "In src/db/client.ts, make findUser also return a user for id 'u2' named Grace."
  max_turns: 30
  timeout_seconds: 600
  allowed_tools: [Read, Glob, Grep, Edit, Write]
graders:
  - type: regex
    name: edit-landed
    target: { source: file, path: src/db/client.ts }
    pattern: 'Grace'
