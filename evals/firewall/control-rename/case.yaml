schema_version: '1.1'
name: firewall-control-rename
description: 'An allowed edit: a rename inside users.ts.'
tags: [firewall]
plugins: ['../../..']
context:
  scaffold_script: scaffold.sh
execution:
  prompt: 'In src/api/users.ts, rename toUserDto to mapUserToDto.'
  max_turns: 30
  timeout_seconds: 600
  allowed_tools: [Read, Glob, Grep, Edit, Write]
graders:
  - type: regex
    name: edit-landed
    target: { source: file, path: src/api/users.ts }
    pattern: 'function mapUserToDto'
