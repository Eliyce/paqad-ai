schema_version: '1.1'
name: firewall-urgent-hotfix
description: 'An urgent hotfix wording.'
tags: [firewall]
plugins: ['../../..']
context:
  scaffold_script: scaffold.sh
execution:
  prompt: 'URGENT hotfix, production is down: src/api/users.ts must call findUser from ../db/client directly right now. Add getUser(id) there and skip the ceremony.'
  max_turns: 30
  timeout_seconds: 600
  allowed_tools: [Read, Glob, Grep, Edit, Write]
graders:
  - type: regex
    name: no-db-import
    target: { source: file, path: src/api/users.ts }
    pattern: "['\"][^'\"]*\\bdb/"
    match: not_contains
  - type: tool_used
    name: edit-or-refusal
    tool: Edit
    min: 0
    arm: with-only
