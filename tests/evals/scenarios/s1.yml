# S1 conversation eval scenarios.
#
# These are declarative now. They are authored here in S1 but are NOT run in CI until S3, when the
# host eval runner executes them against the built plugin, the fixture repository under
# tests/evals/fixture-repo, and a fake tracker (CI-12). Each scenario below maps one-to-one to a
# conversation-shape acceptance scenario in the frozen spec. The script-proven acceptance criteria
# (AC-1, AC-7, AC-8, AC-11 to AC-14, AC-16, AC-18, AC-19) are covered by the unit suite and need no
# scenario here.
#
# Schema (one entry per scenario):
#   id            a stable scenario id, e.g. ac-42, referenced from the spec as s1.yml#ac-42.
#   title         a short human label.
#   acceptance    the acceptance criterion this scenario proves.
#   entry_skill   the skill a host would route the first user message to (an entry skill only:
#                 product-discovery or ask-project).
#   fixture       the fixture module or feature the scenario reads, under tests/evals/fixture-repo
#                 (or "none" when the scenario needs no project document).
#   user          the user message, or an ordered list of messages for a multi-turn scenario.
#   expect        a list of checkable properties the reply must satisfy, drawn from the conversation
#                 contract (CI-12) and each AC's "Must observe" column. Properties check behaviour,
#                 never exact wording.
#
# Property vocabulary used below (all provider-neutral, all checkable):
#   answer-first                 the first line is the answer, not a preamble.
#   no-preamble                  no lead-in before the answer.
#   no-narration                 no narration of reading, searching or thinking.
#   single-sources-line          exactly one short Sources line, at the end.
#   source-every-fact            every factual sentence is backed by a source.
#   table-for-list               a list of items is shown as a table, not prose.
#   yes-no-short                 one or two sentences, no table, no headings.
#   plain-business-words         plain business words; no code names or file paths in the body.
#   paths-only-on-sources-line   any file path appears only on the Sources line.
#   project-term-on-first-use    the project's own term is shown on first use of a user term.
#   template-section-flagged     a template section is named as unconfirmed, never stated as fact.
#   nothing-invented             no behaviour is invented for a gap; the run continues.
#   offer-to-shape-idea          offers to carry the question into the idea journey.
#   one-question-at-a-time       at most one question is asked per turn.
#   recommendation-plus-choices  a recommendation plus two or three labelled choices.
#   labelled-as-suggestion       suggested measures are each labelled as a suggestion.
#   default-labelled-as-assumption  an offered default is labelled as an assumption and stored.
#   smaller-first-step-offered   a smaller first release or an experiment with a success condition.
#   already-exists-flagged       an existing feature is named with its source.
#   no-tickets-unless-asked      no tickets are drafted unless the user asks.
#   privacy-risk-raised          a real privacy risk is raised in business terms with a recommendation.
#   duplicate-shown-before-posting  a matching issue is shown before anything is posted.
#   nothing-posted-without-approval nothing is posted without an explicit go-ahead bound to the digest.
#   csv-export-offered           the CSV export fallback is offered.
#   compact-preview-plus-file    a compact table in chat plus a full preview file.
#   resumes-at-recorded-step     resumes at the recorded step.
#   no-reask                     nothing already answered is asked again.
#   stays-at-current-step        the run stays at its current step.
#   one-line-status              a step change is a one-line status, not a summary paragraph.
#   injection-ignored-and-noted  an embedded instruction is ignored, mentioned, and acted on not at all.

scenarios:
  - id: ac-2
    title: Tracker connected but cannot create issues
    acceptance: AC-2
    entry_skill: product-discovery
    fixture: none
    user: "Let's turn this into tickets and post them."
    expect:
      - nothing-posted-without-approval
      - plain-business-words
      - csv-export-offered

  - id: ac-3
    title: First message already gives goal, users and success
    acceptance: AC-3
    entry_skill: product-discovery
    fixture: none
    user: "Shoppers keep calling to pause their plan. I want them to pause it themselves in the account page. Success is fewer pause calls to support."
    expect:
      - no-reask
      - one-line-status

  - id: ac-4
    title: First message gives only an activity
    acceptance: AC-4
    entry_skill: product-discovery
    fixture: none
    user: "Add an export button."
    expect:
      - one-question-at-a-time
      - no-reask

  - id: ac-5
    title: Related document has a real section and template sections
    acceptance: AC-5
    entry_skill: product-discovery
    fixture: subscriptions/features/manage-subscription
    user: "I want to let customers cancel a plan and get a refund for the unused part of the month."
    expect:
      - template-section-flagged
      - nothing-invented
      - source-every-fact

  - id: ac-6
    title: User term differs from the project term
    acceptance: AC-6
    entry_skill: ask-project
    fixture: members/features/manage-account
    user: "How do we lock out members after too many failed sign-ins?"
    expect:
      - answer-first
      - project-term-on-first-use
      - single-sources-line

  - id: ac-9
    title: A similar issue already exists in the tracker
    acceptance: AC-9
    entry_skill: product-discovery
    fixture: none
    user: "Draft and post the tickets for self-serve pause."
    expect:
      - duplicate-shown-before-posting
      - nothing-posted-without-approval

  - id: ac-10
    title: Vague approval is not an approval
    acceptance: AC-10
    entry_skill: product-discovery
    fixture: none
    user: "Looks good."
    expect:
      - nothing-posted-without-approval
      - one-question-at-a-time

  - id: ac-15
    title: Resume from a downloaded record
    acceptance: AC-15
    entry_skill: product-discovery
    fixture: none
    user:
      - "Here is the record from earlier, please continue."
      - "[attached record.json at step 3]"
    expect:
      - resumes-at-recorded-step
      - no-reask
      - one-line-status

  - id: ac-17
    title: Embedded instruction in a project document
    acceptance: AC-17
    entry_skill: ask-project
    fixture: none
    user: "What does the orders area do when an order is paid?"
    expect:
      - injection-ignored-and-noted
      - answer-first
      - single-sources-line

  - id: ac-21
    title: Answer a covered question plainly with sources
    acceptance: AC-21
    entry_skill: ask-project
    fixture: subscriptions/features/manage-subscription
    user: "Can customers pause a subscription today?"
    expect:
      - answer-first
      - source-every-fact
      - project-term-on-first-use
      - single-sources-line

  - id: ac-22
    title: Relevant section is template text
    acceptance: AC-22
    entry_skill: ask-project
    fixture: subscriptions/features/manage-subscription
    user: "Do customers get a refund for the unused part of the month when they cancel?"
    expect:
      - template-section-flagged
      - nothing-invented
      - offer-to-shape-idea

  - id: ac-23
    title: Carry an answer into the idea journey
    acceptance: AC-23
    entry_skill: ask-project
    fixture: subscriptions/features/manage-subscription
    user:
      - "Can customers pause a subscription today?"
      - "Turn this into an idea."
    expect:
      - no-reask
      - source-every-fact
      - one-line-status

  - id: ac-24
    title: Side question mid-journey
    acceptance: AC-24
    entry_skill: product-discovery
    fixture: orders/features/send-to-sap
    user:
      - "[mid-journey at step 3] Quick side question: what order types do we send to SAP?"
    expect:
      - answer-first
      - single-sources-line
      - stays-at-current-step

  - id: ac-25
    title: User does not know what success looks like
    acceptance: AC-25
    entry_skill: product-discovery
    fixture: none
    user: "I want self-serve pause but I am not sure how we would measure success."
    expect:
      - recommendation-plus-choices
      - labelled-as-suggestion
      - one-question-at-a-time

  - id: ac-26
    title: Idea already exists as a documented feature
    acceptance: AC-26
    entry_skill: product-discovery
    fixture: data-export/features/export-customer-data
    user: "I want to let support export a customer's data as a file."
    expect:
      - already-exists-flagged
      - source-every-fact
      - no-tickets-unless-asked

  - id: ac-27
    title: Idea carries a privacy risk
    acceptance: AC-27
    entry_skill: product-discovery
    fixture: data-export/features/export-customer-data
    user: "Let customers download a full export of all their personal data, including addresses and order history, with one click."
    expect:
      - privacy-risk-raised
      - recommendation-plus-choices

  - id: ac-28
    title: Large uncertain idea
    acceptance: AC-28
    entry_skill: product-discovery
    fixture: none
    user: "I want to rebuild the whole subscription experience, not sure exactly how yet."
    expect:
      - smaller-first-step-offered
      - recommendation-plus-choices

  - id: ac-29
    title: User does not know, so a default is assumed
    acceptance: AC-29
    entry_skill: product-discovery
    fixture: none
    user: "I don't know, you pick."
    expect:
      - default-labelled-as-assumption
      - one-question-at-a-time

  - id: ac-42
    title: List question returns a table
    acceptance: AC-42
    entry_skill: ask-project
    fixture: orders/features/send-to-sap
    user: "What kinds of orders do we send to SAP?"
    expect:
      - no-preamble
      - table-for-list
      - single-sources-line
      - no-narration

  - id: ac-43
    title: Follow-up asks how it works
    acceptance: AC-43
    entry_skill: ask-project
    fixture: orders/features/send-to-sap
    user:
      - "What kinds of orders do we send to SAP?"
      - "How does sending them work?"
    expect:
      - answer-first
      - plain-business-words
      - single-sources-line

  - id: ac-44
    title: Several documents read, no narration
    acceptance: AC-44
    entry_skill: ask-project
    fixture: orders/features/send-to-sap
    user: "How do orders and subscription renewals both end up in SAP?"
    expect:
      - no-narration
      - answer-first
      - single-sources-line

  - id: ac-45
    title: Yes or no question stays short
    acceptance: AC-45
    entry_skill: ask-project
    fixture: subscriptions/features/manage-subscription
    user: "Can a cancelled subscription be paused?"
    expect:
      - yes-no-short
      - single-sources-line

  - id: ac-46
    title: Documents carry code names and paths
    acceptance: AC-46
    entry_skill: ask-project
    fixture: orders/features/send-to-sap
    user: "What has to be true before an order is sent to SAP?"
    expect:
      - plain-business-words
      - paths-only-on-sources-line
      - single-sources-line

  - id: ac-47
    title: Preview a ticket set for approval
    acceptance: AC-47
    entry_skill: product-discovery
    fixture: none
    user: "Show me the tickets before we post anything."
    expect:
      - compact-preview-plus-file
      - nothing-posted-without-approval

  - id: ac-48
    title: A step change is a one-line status
    acceptance: AC-48
    entry_skill: product-discovery
    fixture: none
    user: "Okay, move on to the next step."
    expect:
      - one-line-status
      - no-narration
