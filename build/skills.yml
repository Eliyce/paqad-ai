# Single source of truth for the plugin build.
#
# build/build.py reads name, version, description, license and display text from here and from
# nowhere else, and generates every manifest from these values so no two manifests can disagree
# (PLG-11). Each skill also declares the shared files it imports; the build copies exactly those
# declared files into the skill and fails if a SKILL.md references a shared file it did not
# declare here (PLG-10).
#
# This file uses a deliberately small, flat YAML shape (scalars, one list of skills, and a short
# imports list per skill) so build.py can parse it with a tiny standard-library-only reader and
# avoid any third-party dependency.
#
# The listing scalars (author, author_email, repository, homepage, documentation_url, support_url,
# privacy_policy_url, keywords) are required. They fill the directory listing fields that only the
# Claude branch manifests carry. Quote every URL. keywords is one comma-separated scalar because
# the reader has no top-level lists; build.py splits it.

name: paqad-product-discovery
version: 3.2.0
description: "Ask what a product does, shape ideas into user-story tickets, refine tickets, size work and plan sprints, grounded in the repository's docs and code."
license: MIT
display_name: "Paqad Product Discovery"
author: "Eliyce"
author_email: "haider@eliyce.com"
repository: "https://github.com/Eliyce/paqad-product-discovery-plugin"
homepage: "https://github.com/Eliyce/paqad-product-discovery-plugin#readme"
documentation_url: "https://github.com/Eliyce/paqad-product-discovery-plugin#readme"
support_url: "https://github.com/Eliyce/paqad-product-discovery-plugin/issues"
privacy_policy_url: "https://github.com/Eliyce/paqad-product-discovery-plugin/blob/main/PRIVACY.md"
keywords: "product-discovery, product-management, user-stories, tickets, jira, backlog, sprint-planning"

skills:
  - name: product-discovery
    publish: paqad-discover
    imports:
      - references/voice.md
      - references/consulting.md
      - scripts/canonical.py
      - scripts/record.py
      - scripts/check_record.py
  - name: ask-project
    publish: paqad-ask
    imports:
      - references/voice.md
      - references/consulting.md
      - references/paqad-docs-map.md
      - references/template-markers.md
      - references/connect-repository.md
      - references/evidence-levels.md
      - scripts/check_onboarded.py
      - scripts/find_related.py
      - scripts/detect_placeholder.py
  - name: get-connected
    publish: paqad-get-connected
    imports:
      - references/voice.md
      - references/connect-repository.md
      - references/evidence-levels.md
      - references/tracker-profiles-jira.md
