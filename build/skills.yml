# Single source of truth for the plugin build.
#
# build/build.py reads name, version, description, license and display text from here and from
# nowhere else, and generates every manifest from these values so no two manifests can disagree
# (PLG-11). Each skill also declares the shared files it imports; the build copies exactly those
# declared files into the skill and fails if a SKILL.md references a shared file it did not
# declare here (PLG-10).
#
# This file uses a deliberately small, flat YAML shape (scalars, one list of skills, and a short
# imports list per skill) so build.py can parse it with a tiny standard-library-only reader and
# avoid any third-party dependency.
#
# The listing scalars (author, author_email, repository, homepage, documentation_url, support_url,
# privacy_policy_url, keywords) are required. They fill the directory listing fields that only the
# Claude branch manifests carry. Quote every URL. keywords is one comma-separated scalar because
# the reader has no top-level lists; build.py splits it.
#
# The ChatGPT directory scalars (short_description, long_description, category, default_prompts,
# capabilities) are required too. They fill extensions.com.openai.interface in the native package
# under dist/hosts/chatgpt-directory, together with display_name (displayName, at most 30
# characters), author (developerName, at most 80), homepage, support_url and privacy_policy_url.
# short_description is one line of at most 30 characters, long_description one line of at most
# 4000, and category one of the directory categories listed in build.py (CHATGPT_CATEGORIES).
# default_prompts and capabilities are each one scalar with the entries separated by a pipe (|),
# not a comma, because prompts contain commas and the reader has no top-level lists:
# default_prompts holds 1 to 3 unique prompts of at most 128 characters with no '@', and
# capabilities holds 1 to 20 entries of at most 120 characters. build.py checks every limit.

name: paqad-product-discovery
version: 3.2.0
description: "Ask what a product does, shape ideas into user-story tickets, refine tickets, size work and plan sprints, grounded in the repository's docs and code."
license: MIT
display_name: "Paqad Product Discovery"
author: "Eliyce"
author_email: "haider@eliyce.com"
repository: "https://github.com/Eliyce/paqad-product-discovery-plugin"
homepage: "https://github.com/Eliyce/paqad-product-discovery-plugin#readme"
documentation_url: "https://github.com/Eliyce/paqad-product-discovery-plugin#readme"
support_url: "https://github.com/Eliyce/paqad-product-discovery-plugin/issues"
privacy_policy_url: "https://github.com/Eliyce/paqad-product-discovery-plugin/blob/main/PRIVACY.md"
keywords: "product-discovery, product-management, user-stories, tickets, jira, backlog, sprint-planning"
short_description: "Ideas to ready tickets"
long_description: "Paqad Product Discovery helps product owners, business analysts and delivery leads understand a product and plan work on it without reading code. Ask what the product does today and get a plain answer with its sources, shape a rough idea into clear user-story epics and tickets, refine an existing ticket without losing its intent, get a size suggestion based on comparable finished work, and propose a sprint plan. Answers come from the repository's own documents and code. Limitations: it only reads and never changes code; it needs the repository documents or code through a connected source or uploaded files; it posts tickets to a tracker only through the tracker connector and only after you approve them."
category: "Productivity"
default_prompts: "What does the checkout do today? | Turn this idea into tickets: let shoppers save a basket for later | Plan the next sprint"
capabilities: "Answers questions about what the product does today, with sources | Shapes a rough idea into user-story epics and tickets | Refines an existing ticket without losing its intent | Suggests a size for work from comparable finished work | Proposes a sprint plan for the team to review | Posts approved tickets through your tracker connector"

