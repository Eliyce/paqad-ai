# yaml-language-server: $schema=../schemas/feature-development/reuse.schema.json
# The existing-code digest, the duplication gate and the create-vs-reuse pause.
# Every setting is listed with paqad's default. To change one, remove the # in front of it.
# A setting left commented out uses paqad's default, which can improve in a later version.
# Inside a group, also remove the # in front of the group name, such as updates:. paqad-ai update does this for you.
paqad_version: "1.117.0"

# existing_code_digest:
#   # The token budget for the list of existing code that planning asks the model to reuse.
#   max_tokens: 1000

# duplication:
#   # How paqad treats new code that nearly copies existing code, from a warning to a block.
#   gate: warn
#   # How similar (0 to 1) new code must be to existing code before the duplication check blocks it.
#   min_similarity: 0.9
#   # The fewest meaningful lines a new block of code needs before it is checked for duplication.
#   min_lines: 8

# create_vs_reuse:
#   # How paqad handles a planned new piece of code that looks like existing code, from a report to a pause that waits for your answer.
#   pause: warn
#   # How similar (0 to 1) a planned new name must be to an existing one before paqad asks whether to reuse it.
#   min_similarity: 0.85
#   # The most reuse pauses one change may open, with the rest reported as warnings.
#   max_pauses_per_change: 1
