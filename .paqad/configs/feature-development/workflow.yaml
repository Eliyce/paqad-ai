# Lanes, stage helpers, stage tracking, and per stage: effort, model, extra reads and instructions.
# To change a setting, remove the # in front of it. Settings added later aren't listed here. See .paqad/.config.example or run paqad-ai config show.
# A setting left commented out uses paqad's default, which can improve in a later version.
# Inside a group, also remove the # in front of the group name, such as updates:.
schema_version: 1

# Stops a change once the spec is written, so nothing is implemented.
# stop_after: none

stages:
  planning:
    research:
      # Runs the market research helper during planning.
      market: true
      # Runs the design research helper during planning.
      # design: false
    # How hard the planning stage helper thinks, where inherit uses the effort of the main session and `paqad-ai stage settings` applies a change.
    # effort: high
    # The model the planning stage helper runs on, where inherit uses the model of the main session and `paqad-ai stage settings` applies a change.
    # model: inherit
    # Paths added to paqad's own read list for the planning stage.
    # read: []
    # Instructions added after paqad's own instructions for the planning stage.
    instructions:
      - "Attribution Gate: before producing an implementation sequence, run module-attribution-extractor against the active request. If it returns zero candidates, fall through to module-attribution-inferencer. When the inferencer is confident (top score 0.5 or more), apply the top choice through src/module-decisions/apply.ts (the only writer of module-map.yml) with no packet, and record it in the plan's reuse.consulted as auto-applied with its score, so the owner can see and change it in the spec question round. When it is not confident, keep planning with no-attribution as a provisional label and do not stop: the attribution packet (with its change set) is raised in the spec question round instead (attribution_pending: defer). A project whose policy sets attribution_pending: stop still stops and asks here."
      - "Design-system: if the change touches UI, plan against the design system. Identify tokens, components, and states involved. Flag additions that require extending docs/instructions/design-system/* before extending the code. Missing design-system contract degrades planning to bare-minimum mode (warn, not stop)."
      - "Visual evidence: list the files each plan step expects to touch in its `files` field. When visual_evidence is on and those files (plus the changed files) include a frontend file, `plan compile` checks whether screenshots can be captured here and, if not, opens one decision pause (set it up, attach your own screenshots, or record a waiver). Answer it before building."
    # What planning does when a change has no module owner yet: defer it to later, or stop.
    # module_attribution: defer
  specification:
    # How hard the specification stage helper thinks, where inherit uses the effort of the main session and `paqad-ai stage settings` applies a change.
    # effort: high
    # The model the specification stage helper runs on, where inherit uses the model of the main session and `paqad-ai stage settings` applies a change.
    # model: inherit
    # Paths added to paqad's own read list for the specification stage.
    # read: []
    # Instructions added after paqad's own instructions for the specification stage.
    instructions:
      - "Design-system: if the feature includes new or changed UI, the spec must declare component states, breakpoints exercised, and the a11y contract (WCAG criteria the change must satisfy). This extends the spec-quality-review rubric — incomplete UI contracts surface as findings during review."
      - "Visual evidence: SCRIPT-ENFORCED. When visual_evidence is on and the change touches frontend files, `paqad-ai spec freeze` refuses a spec with no acceptance criterion marked `(proof: visual)`. Name the criterion the screenshots prove."
  development:
    # How hard the development stage helper thinks, where inherit uses the effort of the main session and `paqad-ai stage settings` applies a change.
    # effort: inherit
    # The model the development stage helper runs on, where inherit uses the model of the main session and `paqad-ai stage settings` applies a change.
    # model: inherit
    # Paths added to paqad's own read list for the development stage.
    # read: []
    # Instructions added after paqad's own instructions for the development stage.
    instructions:
      - "Rules loaded: SCRIPT-ENFORCED. Before the first source edit, read the applicable rule text (the `## Loaded rule text` section of `.paqad/context/session-context.md`) and run `paqad-ai rules load` to record it. The pre-mutation kernel gate blocks the first feature-dev edit until `rules-loaded.json` exists, and the completion gate FAILS a change whose applicable rules were never loaded (Inconclusive when the load is stale). The record attests loading, never comprehension."
      - "Design-system: when the diff touches UI source, run token-conformance-review and component-conformance-review as pre-review lint (non-blocking at this stage). Hard-coded design values (hex, raw px/rem, ad-hoc font stacks) where a token exists surface as developer-visible DT findings before review."
      - "Visual evidence: the first frontend edit of a change carries a one-time reminder. Before review, run `paqad-ai visual-evidence run`, or where no capture script or browser exists, attach your own PNG screenshots with `paqad-ai visual-evidence attach <png...> --ac <AC-id>`. Under visual_evidence_mode=strict a frontend change with nothing captured fails unless screenshots are attached or a waiver was recorded."
  review:
    # How hard the review stage helper thinks, where inherit uses the effort of the main session and `paqad-ai stage settings` applies a change, and a lighter review catches less.
    # effort: high
    # The model the review stage helper runs on, where inherit uses the model of the main session and `paqad-ai stage settings` applies a change.
    # model: inherit
    # Paths added to paqad's own read list for the review stage.
    # read: []
    # Instructions added after paqad's own instructions for the review stage.
    instructions:
      - "Design-system: on UI diffs, run ux-heuristic-evaluation and design-system-coverage against the changed surfaces. DT-blocker findings are review-blocking."
  checks:
    # How hard the checks stage helper thinks, where inherit uses the effort of the main session and `paqad-ai stage settings` applies a change.
    # effort: low
    # The model the checks stage helper runs on, where inherit uses the model of the main session and `paqad-ai stage settings` applies a change.
    # model: inherit
    # Paths added to paqad's own read list for the checks stage.
    # read: []
    # Instructions added after paqad's own instructions for the checks stage.
    instructions:
      - Verify test coverage is 100%
      - "Module-health rollup: after format / test / build pass, invoke `paqad-ai module-health rollup` (or `module-health sync --from-report <path>` when CI has already produced a report). The rollup parses the active stack pack's coverage + test reports, attributes rows to module slugs via module-map.yml, and writes .paqad/module-health/<slug>.json with blocked_metrics populated. Surface any rollup-blocked metrics to the user as informational warnings — they're configuration gaps, not decision packets."
      - "Design-test: invoke the design-test runner diff-scoped — only UI files in the diff + routes whose components changed (1-level transitive closure). If contract files (docs/instructions/design-system/*) changed, escalate to whole-app. Block on DT-blocker findings; non-blockers surface as warnings. Strict mode (design_test.strict in project-profile.yaml) is explicit opt-in only — never auto-engaged at Strong tier."
      - "Visual evidence: when visual_evidence is on and the diff is frontend-triggering (a changed file matches an active stack pack's visual_evidence.frontend_globs), run `paqad-ai visual-evidence run` after the command checks. It captures the documented flows the change affects (confirmed site-map journeys) into the feature bundle and the visual-evidence gate verifies them at end-of-change; surface the result in the receipt. Everything at runtime is deterministic — no LLM call. Inert when the flag is off or the change is not frontend. Where no capture script or browser exists, attach your own PNG screenshots with `paqad-ai visual-evidence attach <png...> --ac <AC-id>`. Under visual_evidence_mode=strict a frontend change with nothing captured fails unless screenshots are attached or a waiver decision was recorded; the failing gate prints the exact command."
  documentation_sync:
    # How hard the documentation_sync stage helper thinks, where inherit uses the effort of the main session and `paqad-ai stage settings` applies a change.
    # effort: low
    # The model the documentation_sync stage helper runs on, where inherit uses the model of the main session and `paqad-ai stage settings` applies a change.
    # model: inherit
    # Paths added to paqad's own read list for the documentation_sync stage.
    # read: []
    # Instructions added after paqad's own instructions for the documentation_sync stage.
    instructions:
      - "Design-system: when the diff adds a token, component, or breakpoint to source, invoke design-system-sync to propose contract updates to docs/instructions/design-system/*. Proposals are surfaced via the Decision Pause Contract — never auto-applied."
      - "Site map: the stored site map at docs/site-map/ is a living doc. When the diff moves surfaces, navigation, or guards, treat that map as a canonical doc to keep in sync. Re-run the Site map area so it re-verifies and restamps earned trust and freshness, and stale anchors do not linger. Inert while the site_map flag is off or no map exists."
  # delivery:
  #   # Paths added to paqad's own read list for the delivery stage.
  #   read: []
  #   # Instructions added after paqad's own instructions for the delivery stage.
  #   instructions: []

# stage_helpers:
#   # Uses a team of helper agents for work on the full lane.
#   team_agents: true
#   # The lanes on which each feature-development stage runs in its own helper agent, and full is always included.
#   on_lanes: [ full ]


# How firmly paqad checks that every feature-development stage was run and recorded.
stage_tracking: block
