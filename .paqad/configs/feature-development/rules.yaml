# How project rules are loaded and enforced.
# Every setting is listed with paqad's default. To change one, remove the # in front of it.
# A setting left commented out uses paqad's default, which can improve in a later version.
# Inside a group, also remove the # in front of the group name, such as updates:. paqad-ai update does this for you.
paqad_version: "1.117.0"

# Loads only the rule text that applies to the files in play, instead of every rule in full each session.
# loading: lean

# How firmly the scripted project rules are enforced on the working tree.
enforcement: block

# before_edit:
#   # Which rule scripts run before an edit, either only the fast blocking ones or all of them.
#   run: blocking_only
#   # Milliseconds (500 to 9000) the rule check before an edit may take, after which the edit goes ahead and the checks run at turn end.
#   budget_ms: 6000

# How many rule scripts run at once, from 1 to 8, where auto uses the CPU cores minus one.
# max_parallel: auto
