# How paqad writes and tests skills and helper agents, and its eval runs.
# Every setting is listed with paqad's default. To change one, remove the # in front of it.
# A setting left commented out uses paqad's default, which can improve in a later version.
# Inside a group, also remove the # in front of the group name, such as updates:. paqad-ai update does this for you.
paqad_version: "1.117.0"

# skills:
#   # Turns on the checks and pipeline paqad runs when a skill is written or changed.
#   enabled: true
#   # The share of test queries (0 to 1) a skill description must handle correctly to pass its trigger test.
#   trigger_threshold: 0.9
#   # How many of the three runs of each test query must fire the skill.
#   trigger_min_runs: 2
#   # How many percentage points a skill must raise the pass rate over running without it.
#   eval_min_gain_points: 10
#   # The most tokens a skill run may use, as a multiple of a run without the skill.
#   eval_max_token_multiple: 2
#   # Days a checked outside fact in the sources of a skill stays fresh before release asks for a recheck.
#   fact_max_age_days: 60
#   # How much word overlap (0 to 1) a new skill may have with an installed one before it counts as a clash.
#   collision_jaccard: 0.4
#   # The total characters of all installed skill descriptions before release warns that some may be dropped.
#   description_budget_chars: 8000
#   # The most tokens the body of a skill file may hold.
#   body_max_tokens: 5000
#   # How far (0 to 1) the pass rate of a changed skill may fall below the old version before it fails.
#   regression_tolerance: 0.2
#   # Days without a firing before a skill is reported as unused.
#   dark_window_days: 30

# runs:
#   # How many times each eval case runs with the skill and without it.
#   per_arm: 3
#   # The most revision rounds an eval loop runs before it stops.
#   max_iterations: 3
#   # A tool result larger than this many tokens is flagged as too large in an eval run.
#   tool_result_max_tokens: 10000
#   # The share of cache hits (0 to 1) below which an eval run is recorded as slow.
#   cache_hit_min: 0.7
#   # Whether trigger test queries are sent as one batch when the host offers it.
#   batch: auto
#   # The most US dollars one eval or trigger run may spend before it stops and counts as failed.
#   max_cost_usd: 5
#   # An OpenTelemetry address to also read usage numbers from, where empty reads them from the host only and paqad never sends transcripts there.
#   otel_endpoint: ""

# agents:
#   # Turns on the checks and pipeline paqad runs when a helper agent is written or changed.
#   enabled: true
#   # The score (0 to 1) an agent must reach when each of its eval cases runs three times.
#   pass_k_threshold: 0.9
#   # The score (0 to 1) an unattended stage agent must reach when each of its eval cases runs three times.
#   stage_pass_k_threshold: 0.95
#   # The share of test requests (0 to 1) an agent description must route to the agent correctly.
#   delegation_threshold: 0.9
#   # The most tokens an agent description may hold.
#   description_max_tokens: 300
#   # The most tokens an agent report may hold when the agent names no smaller limit.
#   report_max_tokens: 2000
#   # The most tokens the instructions of an agent may hold.
#   prompt_max_tokens: 3000
#   # The most tools an agent may list before it needs an approval.
#   max_tools: 10
#   # The most an agent run may cost, as a multiple of doing the work in the main session, unless it saves time by running in parallel.
#   max_cost_multiple: 4
#   # The most tokens all installed agent descriptions may hold together.
#   catalog_description_max_tokens: 15000
#   # The most lines the memory file of an agent may hold.
#   memory_max_lines: 200
