triggers:
  - workflow:
      - pentest
cache_key_inputs:
  - docs/modules/**
  - tests/**
input_schema:
  module_doc_paths:
    type: path[]
    required: true
    description: Module docs describing authentication flows, sessions, and token handling.
  test_paths:
    type: path[]
    required: false
    description: Tests that may prove authentication mechanism security.
