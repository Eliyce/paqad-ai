triggers:
  - workflow:
      - pentest
cache_key_inputs:
  - docs/modules/**
  - tests/**
input_schema:
  module_doc_paths:
    type: path[]
    required: true
    description: Module docs describing sensitive operations, financial actions, and authentication flows.
  test_paths:
    type: path[]
    required: false
    description: Tests that may prove audit logging or log integrity.
