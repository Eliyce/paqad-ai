triggers:
  - workflow:
      - pentest
cache_key_inputs:
  - docs/modules/**
  - tests/**
input_schema:
  module_doc_paths:
    type: path[]
    required: true
    description: Module docs describing data storage, encryption, token generation, and external communication.
  test_paths:
    type: path[]
    required: false
    description: Tests that may prove cryptographic strength or key management.
