triggers:
  - ui_impact:
      - new-component
      - new-screen
      - redesign
cache_key_inputs:
  - docs/modules/*/ui/components.md
  - docs/modules/*/ui/screens.md
input_schema:
  ui_surface_paths:
    type: path[]
    required: true
    description: UI surfaces or docs to evaluate.
  request_text:
    type: string
    required: false
    description: Optional evaluation scope.
