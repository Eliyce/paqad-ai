triggers:
  - workflow:
      - design-test
      - design-retest
cache_key_inputs:
  - src/**
  - docs/instructions/design-system/tokens.md
input_schema:
  source_roots:
    type: path[]
    required: true
    description: Roots to scan for UI source; typically `src/`, `app/`, or `graph-ui/src/`.
  tokens_path:
    type: path
    required: true
    description: Path to the project's tokens.md contract clause.
