triggers:
  - workflow:
      - project-question
      - feature-development
      - bug-fix
      - refactor
      - migration
      - investigation
cache_key_inputs:
  - request_text
input_schema:
  request_text:
    type: string
    required: true
    description: Raw user request to classify.
  linked_spec_paths:
    type: path[]
    required: false
    description: Optional spec or issue files explicitly linked to the request.
on_complete:
  emit: classification_ready
  triggers:
    - router
