triggers:
  - workflow:
      - feature-development
      - bug-fix
      - refactor
      - migration
cache_key_inputs:
  - docs/**/*.md
  - src/**/*.ts
input_schema:
  changed_files:
    type: path[]
    required: true
    description: Changed implementation or doc files.
  canonical_doc_paths:
    type: path[]
    required: true
    description: Canonical docs to review for drift.
