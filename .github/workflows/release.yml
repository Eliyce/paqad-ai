name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  id-token: write

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    if: github.repository_owner == 'Eliyce'
    permissions:
      contents: write
      pull-requests: write
      id-token: write
      checks: read
      actions: read
    outputs:
      published: ${{ steps.published.outputs.plugin_needed }}
      version: ${{ steps.published.outputs.version }}
      sha: ${{ steps.published.outputs.sha }}
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          # The tag step pushes tags on older commits whose workflow files differ from main.
          # GitHub only allows that with a token that has the Workflows permission.
          token: ${{ secrets.GH_RELEASE_TOKEN }}

      - name: Enable Corepack
        run: corepack enable

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install graph-ui dependencies
        run: pnpm --dir graph-ui install --frozen-lockfile

      - name: Upgrade npm (Trusted Publishing needs npm >= 11.5.1)
        run: npm install -g "npm@>=11.5.1 <12"

      - name: Build
        run: pnpm run build
        env:
          NODE_OPTIONS: --max-old-space-size=4096

      - name: Prove CI is green on this tree
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/release-sync.mjs ci-green

      - name: Create release PR or publish to npm
        id: changesets
        uses: changesets/action@v1
        with:
          version: pnpm run version-packages
          publish: pnpm run release
          commit: 'chore(release): version packages'
          title: 'chore(release): version packages'
        env:
          GITHUB_TOKEN: ${{ secrets.GH_RELEASE_TOKEN }}
          NPM_CONFIG_PROVENANCE: 'true'

      - name: Read what npm and the plugin repo have
        id: published
        run: node scripts/release-sync.mjs state

      - name: Tag and create the GitHub Release for every published version
        env:
          GH_TOKEN: ${{ secrets.GH_RELEASE_TOKEN }}
        run: node scripts/release-sync.mjs tags

  publish-plugin:
    name: Publish the plugin
    needs: release
    if: needs.release.outputs.published == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check the plugin push token
        id: token
        env:
          PAQAD_PLUGIN_PUSH_TOKEN: ${{ secrets.PAQAD_PLUGIN_PUSH_TOKEN }}
        run: |
          if [ -z "$PAQAD_PLUGIN_PUSH_TOKEN" ]; then
            echo "::error::PAQAD_PLUGIN_PUSH_TOKEN is not set. Add a token that can push to Eliyce/paqad-claude-plugin as a repository secret, then re-run this job."
            exit 1
          fi

      - name: Checkout the released commit
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.release.outputs.sha }}

      - name: Check the checkout is the released version
        env:
          RELEASED_VERSION: ${{ needs.release.outputs.version }}
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          if [ "$VERSION" != "$RELEASED_VERSION" ]; then
            echo "::error::package.json at the released commit is ${VERSION}, but npm published ${RELEASED_VERSION}."
            exit 1
          fi

      - name: Enable Corepack
        run: corepack enable

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install graph-ui dependencies
        run: pnpm --dir graph-ui install --frozen-lockfile

      - name: Build
        run: pnpm run build
        env:
          NODE_OPTIONS: --max-old-space-size=4096

      - name: Push the plugin to Eliyce/paqad-claude-plugin
        env:
          PAQAD_PLUGIN_PUSH_TOKEN: ${{ secrets.PAQAD_PLUGIN_PUSH_TOKEN }}
        run: |
          set -eu
          VERSION="$(node -p "require('./package.json').version")"
          git -c init.defaultBranch=main clone --quiet "https://x-access-token:${PAQAD_PLUGIN_PUSH_TOKEN}@github.com/Eliyce/paqad-claude-plugin.git" plugin-repo
          if git -C plugin-repo ls-remote --exit-code --heads origin main > /dev/null; then
            git -C plugin-repo checkout --quiet -B main origin/main
          else
            git -C plugin-repo symbolic-ref HEAD refs/heads/main
          fi
          node scripts/assemble-plugin.mjs plugin-repo
          cd plugin-repo
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          BRANCH=main
          git add -A
          if git diff --cached --quiet; then
            echo "The plugin tree is unchanged at v${VERSION}; nothing to commit."
          else
            git commit --quiet -m "paqad v${VERSION}"
            git push --quiet origin "HEAD:refs/heads/${BRANCH}"
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/v${VERSION}" > /dev/null; then
            echo "Tag v${VERSION} already exists on Eliyce/paqad-claude-plugin."
          else
            git tag "v${VERSION}"
            git push --quiet origin "refs/tags/v${VERSION}"
          fi

  plugin-in-sync:
    name: Plugin matches npm
    needs: [release, publish-plugin]
    if: always() && needs.release.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Fail when the plugin is behind npm
        run: node scripts/release-sync.mjs check
