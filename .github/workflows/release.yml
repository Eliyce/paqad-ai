name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

# Required permissions for the changesets bot:
#  - contents: write       -> create release commits, tags, GitHub releases
#  - pull-requests: write  -> open and update the "Version Packages" PR
#  - id-token: write       -> publish with provenance (npm verifies the build came from this repo)
permissions:
  contents: write
  pull-requests: write
  id-token: write

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    # Guard against forked-repo pushes - secrets aren't available there.
    if: github.repository_owner == 'Eliyce'
    outputs:
      published: ${{ steps.changesets.outputs.published }}
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Enable Corepack
        run: corepack enable

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install graph-ui dependencies
        run: pnpm --dir graph-ui install --frozen-lockfile

      # Pin to the 11.x line: Trusted Publishing needs npm >= 11.5.1, but a
      # moving @latest let npm 12 in, which changed `npm pack --json` output
      # and crashed the publish-time E2E (issue #332). A range floor keeps
      # provenance/OIDC working while excluding surprise breaking majors.
      - name: Upgrade npm (Trusted Publishing needs npm >= 11.5.1)
        run: npm install -g "npm@>=11.5.1 <12"

      - name: Build
        run: pnpm run build
        # Match CI (issue #615): give tsup's DTS worker heap headroom so the release build never
        # hits ERR_WORKER_OUT_OF_MEMORY.
        env:
          NODE_OPTIONS: --max-old-space-size=4096

      - name: Create release PR or publish to npm
        id: changesets
        uses: changesets/action@v1
        with:
          version: pnpm run version-packages
          publish: pnpm run release
          commit: 'chore(release): version packages'
          title: 'chore(release): version packages'
        env:
          # PAT (not default GITHUB_TOKEN) so CI runs on the bot's release PR.
          # Workflow tokens cannot trigger downstream workflow runs.
          GITHUB_TOKEN: ${{ secrets.GH_RELEASE_TOKEN }}
          # No NPM_TOKEN: publishes use Trusted Publishing (OIDC) configured at
          # https://www.npmjs.com/package/paqad-ai/access. The npm CLI exchanges
          # the workflow's id-token for short-lived publish credentials.
          NPM_CONFIG_PROVENANCE: 'true'

  publish-plugin:
    name: Publish the plugin
    needs: release
    if: needs.release.outputs.published == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check the plugin push token
        id: token
        env:
          PAQAD_PLUGIN_PUSH_TOKEN: ${{ secrets.PAQAD_PLUGIN_PUSH_TOKEN }}
        run: |
          if [ -z "$PAQAD_PLUGIN_PUSH_TOKEN" ]; then
            echo "::notice::PAQAD_PLUGIN_PUSH_TOKEN is not set; skipping the plugin publish"
            echo "present=false" >> "$GITHUB_OUTPUT"
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        if: steps.token.outputs.present == 'true'
        uses: actions/checkout@v7

      - name: Enable Corepack
        if: steps.token.outputs.present == 'true'
        run: corepack enable

      - name: Setup Node
        if: steps.token.outputs.present == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        if: steps.token.outputs.present == 'true'
        run: pnpm install --frozen-lockfile

      - name: Install graph-ui dependencies
        if: steps.token.outputs.present == 'true'
        run: pnpm --dir graph-ui install --frozen-lockfile

      - name: Build
        if: steps.token.outputs.present == 'true'
        run: pnpm run build
        env:
          NODE_OPTIONS: --max-old-space-size=4096

      - name: Push the plugin to Eliyce/paqad-plugin
        if: steps.token.outputs.present == 'true'
        env:
          PAQAD_PLUGIN_PUSH_TOKEN: ${{ secrets.PAQAD_PLUGIN_PUSH_TOKEN }}
        run: |
          set -eu
          VERSION="$(node -p "require('./package.json').version")"
          git -c init.defaultBranch=main clone --quiet "https://x-access-token:${PAQAD_PLUGIN_PUSH_TOKEN}@github.com/Eliyce/paqad-plugin.git" plugin-repo
          node scripts/assemble-plugin.mjs plugin-repo
          cd plugin-repo
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "The plugin tree is unchanged at v${VERSION}."
          else
            git commit --quiet -m "paqad v${VERSION}"
          fi
          BRANCH="$(git symbolic-ref --short HEAD)"
          git push --quiet origin "HEAD:refs/heads/${BRANCH}"
          if git ls-remote --exit-code --tags origin "refs/tags/v${VERSION}" > /dev/null; then
            echo "Tag v${VERSION} already exists on Eliyce/paqad-plugin."
          else
            git tag "v${VERSION}"
            git push --quiet origin "refs/tags/v${VERSION}"
          fi
