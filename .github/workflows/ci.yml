# Pull-request CI (REQUIREMENTS.md section 12.1).
#
# Every named step below actually runs and enforces its check: the job fails on any violation.
# Per RULE-19 (CI/CD) the pipeline runs the same gates that block local delivery (the unittest
# discover and build.py invocations the .paqad/project-profile.yaml test and build commands use)
# and pins every tool version.
#
# Honesty notes for the steps whose tooling is not exercisable on a stock runner today:
#   - CI-7 coverage runs under a pinned coverage that is a CI-only dev dependency, never shipped.
#   - The two external CI-9 validators (claude plugin validate, skills-ref validate) run only when
#     the repo variable ENABLE_PLUGIN_VALIDATORS is set to 'true'. This mirrors how release.yml
#     guards publish behind ENABLE_RELEASE. The skills-ref install is still a placeholder, so
#     leaving the validators ungated would red every PR. Until they are enabled the PR gate's real
#     checks (the authoring and script tests, CI-3, CI-6, CI-10, the deterministic build and CI-7
#     coverage) stay green and trustworthy.
#   - CI-9 runs "claude plugin validate --strict" from the pinned Claude Code CLI 2.1.300 through
#     npx, on the Claude branch (dist/hosts/claude, the root of the public directory repo) and on
#     its plugin folder. --strict fails on any warning as well as any error. Older CLIs have no
#     --strict and reject the directory listing fields, so the version stays pinned.
name: ci

on:
  pull_request:
  workflow_dispatch:

jobs:
  pr-checks:
    name: PR checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"

      - name: Build dist once
        run: python build/build.py --dist dist

      # CI-16: the ChatGPT directory submission zip (the native package under
      # dist/hosts/chatgpt-directory) must pack byte-identically twice in one job and pass the
      # documented pre-submission rules. The check is necessary, not sufficient: the portal may
      # enforce rules it does not document. Any non-zero exit fails the job.
      - name: CI-16 ChatGPT submission zip is deterministic and passes the pre-submission check
        run: |
          python build/package_chatgpt.py --dist dist --out /tmp/chatgpt-a.zip
          python build/package_chatgpt.py --dist dist --out /tmp/chatgpt-b.zip
          cmp /tmp/chatgpt-a.zip /tmp/chatgpt-b.zip
          python build/check_chatgpt_submission.py --zip /tmp/chatgpt-a.zip

      # CI-1, CI-2, CI-4, CI-5, CI-11, CI-20: tests/scripts/test_authoring.py enforces frontmatter,
      # skill size, neutral wording, em and en dash, trigger hygiene and the voice block. The same
      # discover run also executes the new CI-script tests (test_ci_checks, test_bump_version) and
      # the existing build and parity tests. This is the one real unit-test step.
      - name: CI-1 CI-2 CI-4 CI-5 CI-11 CI-20 authoring and script unit tests
        run: python -m unittest discover -s tests/scripts -p "test_*.py" -v

      - name: CI-3 Forbidden content over the built dist
        run: python tests/ci/check_forbidden.py --dist dist

      - name: CI-6 Secret scan over the source tree
        run: python tests/ci/check_secrets.py

      - name: CI-10 Budget over the built dist (per installable unit)
        run: python tests/ci/check_budget.py --dist dist

      # CI-19 integrity: the hand-filled host verdicts must stay in the CI-19 vocabulary and never
      # claim installed or verified support without evidence. This enforces the record, not the
      # install; flipping a verdict stays a manual per-host step.
      - name: CI-19 Host-verdict integrity
        run: python tests/ci/check_host_verdicts.py

      # CI-8: build.py must succeed, reject undeclared shared imports and produce byte-identical
      # output on two consecutive runs.
      - name: CI-8 Build is deterministic
        run: |
          python build/build.py --dist /tmp/dist-a
          python build/build.py --dist /tmp/dist-b
          diff -r /tmp/dist-a /tmp/dist-b

      # CI-9: the Claude validator is exercised only when ENABLE_PLUGIN_VALIDATORS is set. It runs
      # the pinned CLI with --strict on the Claude branch marketplace and on its plugin, and exits
      # non-zero on any error or warning.
      - name: CI-9 set up Node for the pinned Claude Code CLI
        if: ${{ vars.ENABLE_PLUGIN_VALIDATORS == 'true' }}
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: CI-9 claude plugin validate --strict on dist/hosts/claude
        if: ${{ vars.ENABLE_PLUGIN_VALIDATORS == 'true' }}
        run: |
          npx -y @anthropic-ai/claude-code@2.1.300 plugin validate --strict dist/hosts/claude
          npx -y @anthropic-ai/claude-code@2.1.300 plugin validate --strict dist/hosts/claude/plugins/paqad-product-discovery

      # CI-9: skills-ref validate on dist. The exact install command for skills-ref is not documented
      # in this repo, so the install below is a clearly named placeholder; the validator is still
      # invoked so the step fails on any skills-ref error once the install is pinned in CI.
      - name: CI-9 install skills-ref (placeholder install, pin in CI)
        if: ${{ vars.ENABLE_PLUGIN_VALIDATORS == 'true' }}
        run: echo "TODO pin and install skills-ref here (CI-only dev tool, verified in CI)"
      - name: CI-9 skills-ref validate on dist
        if: ${{ vars.ENABLE_PLUGIN_VALIDATORS == 'true' }}
        run: skills-ref validate dist

  coverage:
    name: CI-7 script coverage gate
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # coverage is a CI-only dev dependency; it is never copied into dist by build.py.
      - name: Install coverage (pinned, CI-only)
        run: python -m pip install "coverage==7.6.1"

      # CI-7: 90 percent branch coverage of the script surface on Python 3.9 and a current Python.
      # The CI environment installs only coverage, so any import outside the standard library in a
      # covered module fails this run (the stdlib-only guarantee, NFR-1, RULE-24).
      - name: CI-7 branch coverage over scripts (90 percent, stdlib only)
        run: |
          coverage run --branch \
            --source=build,shared/scripts,skills,tests/ci \
            -m unittest discover -s tests/scripts -p "test_*.py"
          coverage report --fail-under=90
