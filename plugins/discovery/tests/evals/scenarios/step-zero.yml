# Step 0 scenarios: get-connected finds the Jira project from the repository's branch names and
# commit subjects before any tracker read, and never searches the tracker broadly. They are
# declarative, like s1.yml, and are NOT run in CI; the host eval runner executes them against the
# built plugin and the fixture repository under tests/evals/fixture-repo (CI-12).
#
# Schema: identical to s1.yml (id, title, acceptance, entry_skill, fixture, user, expect), plus
# the fields named below.
#
# AC-115 to AC-123 are conversation-shape acceptance scenarios for the step 0 project scan, each
# exercised by a scenario below; the counting rule is script-proven by test_find_ticket_keys.py.
# Their extra fields: branches and commits list what the repository connector's list actions
# return, newest first, as plain scalars, or the single scalar "list fails"; trackers lists what is
# connected as plain scalars (jira, github).
# Property vocabulary added for them:
#   project-sentence-once          "Your branches and commits mostly mention ABC tickets, so I'll use
#                                  the ABC project in Jira." is said once, with the prefix found.
#   one-project-choice-prompt      one choice prompt names the project or projects to use.
#   offers-a-different-project     the prompt offers a different project.
#   only-one-project-check-read    the only tracker read before the choice is one read of that project.
#   no-broad-tracker-search        the tracker is never searched broadly to find the project.
#   asks-which-project             step 0 asks which Jira project to use and recommends nothing.
#   prefix-as-plain-choice         the prefix found is a plain choice, not a recommendation.
#   most-hits-first                the choices are ordered by hits, the top one recommended.
#   reason-said-once               the reason the check failed is said once.
#   key-source-repository          setup.project_key_source is repository.
#   key-source-asked               setup.project_key_source is asked.
#   counts-only-scan               setup.ticket_key_scan holds counts only, no branch or commit text.
#   jira-named-once-with-choice    the Jira project is named once and the person chooses between
#                                  connecting Jira now and carrying on with GitHub, exporting.
#   scan-on-lines-read             the scan runs on the lines that were read and records lines_read.
#   no-unreadable-sentence         the unreadable-connector sentence is not said.
#   tracker-kind-github            setup.tracker_kind is github and the hand off is export only.
#   scan-skipped                   no branch or commit list is read.

scenarios:
  - id: ac-115
    title: Branches and commits mostly carry ABC keys
    acceptance: AC-115
    entry_skill: product-discovery
    fixture: fixture-repo
    trackers:
      - jira
    branches:
      - "feature/abc-120-export"
      - "fix/ABC-118-totals"
      - "abc-121-refunds"
    commits:
      - "ABC-117 add the refund reason"
      - "Merge pull request #12 from shop/abc-116"
    user: "Shoppers want to save a basket for later."
    expect:
      - project-sentence-once
      - one-project-choice-prompt
      - offers-a-different-project
      - only-one-project-check-read
      - no-broad-tracker-search
      - key-source-repository
      - counts-only-scan

  - id: ac-116
    title: No ticket keys in branches or commits
    acceptance: AC-116
    entry_skill: product-discovery
    fixture: fixture-repo
    trackers:
      - jira
    branches:
      - "main"
      - "feature/save-basket"
    commits:
      - "Add the basket page"
    user: "Shoppers want to save a basket for later."
    expect:
      - asks-which-project
      - no-broad-tracker-search
      - key-source-asked

  - id: ac-117
    title: One prefix with two hits and version words
    acceptance: AC-117
    entry_skill: product-discovery
    fixture: fixture-repo
    trackers:
      - jira
    branches:
      - "feature/abc-1-x"
    commits:
      - "ABC-2 small fix"
      - "upgrade to node-18"
      - "react-19 bump"
    user: "Shoppers want to save a basket for later."
    expect:
      - asks-which-project
      - prefix-as-plain-choice
      - offers-a-different-project
      - key-source-asked

  - id: ac-118
    title: The recommended project cannot be read
    acceptance: AC-118
    entry_skill: product-discovery
    fixture: fixture-repo
    trackers:
      - jira
    branches:
      - "feature/old-1"
      - "feature/old-2"
      - "feature/old-3"
    commits:
      - "OLD-4 tidy"
    user: "Shoppers want to save a basket for later."
    expect:
      - reason-said-once
      - asks-which-project
      - no-broad-tracker-search
      - key-source-asked

  - id: ac-119
    title: Two prefixes with close counts
    acceptance: AC-119
    entry_skill: product-discovery
    fixture: fixture-repo
    trackers:
      - jira
    branches:
      - "feature/abc-1"
      - "feature/abc-2"
      - "feature/abc-3"
      - "feature/abc-4"
      - "feature/abc-5"
      - "feature/xyz-1"
      - "feature/xyz-2"
      - "feature/xyz-3"
    commits:
      - "Add the basket page"
    user: "Shoppers want to save a basket for later."
    expect:
      - one-project-choice-prompt
      - most-hits-first
      - offers-a-different-project
      - no-broad-tracker-search

  - id: ac-120
    title: Keys point to Jira but only GitHub is connected
    acceptance: AC-120
    entry_skill: product-discovery
    fixture: fixture-repo
    trackers:
      - github
    branches:
      - "feature/abc-120-export"
      - "fix/ABC-118-totals"
      - "abc-121-refunds"
    commits:
      - "ABC-117 add the refund reason"
    user: "Shoppers want to save a basket for later."
    expect:
      - jira-named-once-with-choice
      - no-broad-tracker-search

  - id: ac-121
    title: The branch list works and the commit list errors
    acceptance: AC-121
    entry_skill: product-discovery
    fixture: fixture-repo
    trackers:
      - jira
    branches:
      - "feature/abc-120-export"
      - "fix/ABC-118-totals"
      - "abc-121-refunds"
    commits: "list fails"
    user: "Shoppers want to save a basket for later."
    expect:
      - scan-on-lines-read
      - project-sentence-once
      - no-unreadable-sentence

  - id: ac-122
    title: Only GitHub refs in branches and commits
    acceptance: AC-122
    entry_skill: product-discovery
    fixture: fixture-repo
    trackers:
      - github
    branches:
      - "fix-123-totals"
    commits:
      - "Fix the totals (#123)"
      - "Merge pull request #45 from shop/basket"
    user: "Shoppers want to save a basket for later."
    expect:
      - tracker-kind-github
      - no-broad-tracker-search

  - id: ac-123
    title: No repository attached
    acceptance: AC-123
    entry_skill: product-discovery
    fixture: none
    trackers:
      - jira
    user: "Shoppers want to save a basket for later."
    expect:
      - scan-skipped
      - asks-which-project
      - no-broad-tracker-search
