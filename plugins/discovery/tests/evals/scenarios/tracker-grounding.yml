      - injection-ignored-and-noted

  - id: tg-87
    title: The tracker is switched on right after the stop message
    acceptance: AC-87
    entry_skill: product-discovery
    fixture: none
    tracker: not readable, then readable in the same conversation
    user: "I have switched the tracker on now."
    expect:
      - same-run-continues
      - no-reask
      - tracker-only-sentence-once

  - id: tg-88
    title: A repository and no readable tracker
    acceptance: AC-88
    entry_skill: product-discovery
