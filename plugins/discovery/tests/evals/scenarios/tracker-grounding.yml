      - no-epic-question
      - hands-off-by-export

  - id: tg-89
    title: A record written before tracker grounding is resumed
    acceptance: AC-89
    entry_skill: product-discovery
    fixture: fixture record before tracker grounding
    tracker: readable and writable
    user: "Here is my resume file, carry on."
    expect:
      - resumes-at-recorded-step
      - no-tracker-read
      - source-line-unchanged

  - id: tg-90
    title: A resumed tracker-only run whose tracker is gone
    acceptance: AC-90
    entry_skill: product-discovery
    fixture: none
    tracker: readable in the earlier session, not readable now
    user: "Here is my resume file, carry on."
    expect:
