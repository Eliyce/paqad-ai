  - id: tg-86
    title: Tickets that carry comments, an assignee, a reporter and an attachment
    acceptance: AC-86
    entry_skill: product-discovery
    fixture: none
    tracker: readable and writable
    user: "Let a customer swap one item in their next box."
    expect:
